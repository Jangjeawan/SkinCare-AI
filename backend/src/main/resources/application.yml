server:
  port: 9800

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
#      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

    database-platform: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_SECRET}
            scope:
              - email
              - profile

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  cache:
    disabled: true # 캐시 사용 여부
  api-docs:
    path: /v3/api-docs
    groups:
      enabled: true
  swagger-ui:
    enabled: true # Swagger UI 접근 경로 => http://localhost:9800/swagger-ui/index.html
    path: /swagger.html # Swagger UI 추가 접근 경로 => http://localhost:8080/swagger.html
    tags-sorter: alpha # alpha: 알파벳 순 태그 정렬, method: HTTP Method 순 정렬
    operations-sorter: alpha # alpha: 알파벳 순 태그 정렬, method: HTTP Method 순 정렬
